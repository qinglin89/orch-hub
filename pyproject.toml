[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orch-hub"
version = "0.1.0"
description = "Local control plane for a portfolio of Mandrel-managed AI coding workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
# Build toolchain for the compiled standalone release runtime. Pinned exactly:
# the freezer decides the payload's layout and bootloader, so an unpinned bump
# would silently change what a release artifact *is*.
release = ["pyinstaller==6.22.2"]

[project.scripts]
orch-hub = "orch_hub.cli:main"
orch-hub-api = "orch_hub.api:run"
# Operator-installed Claude Code statusLine wrapper: captures the CLI's own
# subscription usage for the Overview and passes the wrapped status line through.
orch-hub-statusline = "orch_hub.statusline:main"

[tool.setuptools]
packages = ["orch_hub"]

[tool.setuptools.package-data]
# Ship the dashboard shell assets so a non-editable install can serve them
# (the editable dev install resolves them from the source tree directly).
orch_hub = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the in-repo `orch_hub` package importable without an install step.
pythonpath = ["."]
