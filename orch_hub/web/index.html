<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Dark is the default scheme. The saved Dark/Light/System choice is resolved
         to a concrete `data-theme` before the first frame by the pre-paint script
         below; styles.css sets the matching `color-scheme` per theme. `dark light`
         biases the pre-CSS canvas toward the default. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Mobile browser-chrome tint (address bar). app.js keeps it in step with the
         resolved theme's surface colour; this initial value is the dark default. -->
    <meta name="theme-color" content="#0f151d" />
    <title>orch-hub</title>
    <!-- Inline empty icon: avoids a /favicon.ico request that the default-deny
         auth middleware would answer with 401. -->
    <link rel="icon" href="data:," />
    <!-- Pre-paint appearance resolution. Two INDEPENDENT axes are resolved and
         written to <html> before the stylesheet paints a frame, so neither flashes
         on startup: the Dark/Light/System *mode* → data-theme, and the Neon Cyan /
         Wasteland Orange *palette* → data-palette. Kept inline and tiny because
         app.js only loads after the first paint; app.js re-applies the same logic
         and owns the live controls plus system-change following. Each axis fails
         safe on its own (Dark / Neon Cyan) when storage is unavailable or the
         stored value is invalid, and reads its own key — a returning Dark/Light/
         System user keeps their mode and simply gains the Neon Cyan default. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("orch-hub-theme");
          if (pref !== "light" && pref !== "system") pref = "dark";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        try {
          var palette = localStorage.getItem("orch-hub-palette");
          if (palette !== "wasteland-orange") palette = "neon-cyan";
          document.documentElement.setAttribute("data-palette", palette);
        } catch (e) {
          document.documentElement.setAttribute("data-palette", "neon-cyan");
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Skip link: first thing in the tab order, jumps past the header chrome.
         The href is inert (app.js preventDefaults it and focuses #view) because
         a real `#view` navigation would be read by the hash router as a route. -->
    <a class="skip-link" id="skip-link" href="#view">Skip to main content</a>

    <header class="app-header">
      <span class="app-title">orch-hub</span>
      <!-- Header actions sit at the right edge. The Appearance control is always
           present (including the login gate); Sign out is auth-gated by app.js. -->
      <div class="header-actions">
        <!-- Appearance: one compact popover holding the two INDEPENDENT preference
             axes (mode + palette). Collapsing them behind a single icon-sized
             toggle keeps the mobile header from overflowing at 320px, even
             post-auth with Sign out visible. The toggle is a real
             <button aria-expanded> for full touch + keyboard support; app.js
             opens/closes the panel (Escape + outside-click), and the native
             <select>s inside keep each axis operable. The swatch dot reflects the
             active palette accent so the closed control still signals it. -->
        <div class="appearance">
          <button
            id="appearance-toggle"
            class="appearance-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="appearance-panel"
            aria-label="Appearance"
          >
            <span class="appearance-dot" aria-hidden="true"></span>
          </button>
          <div
            id="appearance-panel"
            class="appearance-panel"
            role="group"
            aria-label="Appearance"
            hidden
          >
            <label class="appearance-row">
              <span class="appearance-label">Mode</span>
              <select id="theme-select" class="theme-select" aria-label="Mode">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="system">System</option>
              </select>
            </label>
            <label class="appearance-row">
              <span class="appearance-label">Palette</span>
              <select
                id="palette-select"
                class="palette-select"
                aria-label="Palette"
              >
                <option value="neon-cyan">Neon Cyan</option>
                <option value="wasteland-orange">Wasteland Orange</option>
              </select>
            </label>
          </div>
        </div>
        <button
          id="signout-btn"
          class="icon-btn"
          type="button"
          aria-label="Sign out"
          hidden
        >
          Sign&nbsp;out
        </button>
      </div>
    </header>

    <!-- app.js renders the login gate or the routed view into #view, each
         starting with an `h1.page-title` that names the page. `tabindex="-1"`
         makes the region a programmatic focus target for the skip link and for
         a route change that renders no heading.
         Deliberately NOT an aria-live region: the whole view is repainted by
         the Overview auto-refresh, the intake poll, and every log line, which
         would make a live region narrate the entire page every few seconds.
         Announcements are scoped to the small regions that actually change
         (counts, control status, alerts) plus the post-navigation heading. -->
    <main id="view" class="view" tabindex="-1"></main>

    <nav id="nav" class="tabbar" aria-label="Primary" hidden>
      <a href="#/overview" data-tab="/overview">Overview</a>
      <a href="#/repos" data-tab="/repos">Repos</a>
      <a href="#/tasks" data-tab="/tasks">Tasks</a>
      <a href="#/runs" data-tab="/runs">Runs</a>
    </nav>

    <script src="/app.js"></script>
  </body>
</html>
